 server:
    port: 8086

    tomcat:
      max-http-form-post-size: -1
      max-swallow-size: 100MB
      max-parameter-count: -1

  spring:
    application:
      name: delivery-service

    datasource:
      url: jdbc:mysql://localhost:3306/revcart_delivery?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: YOUR_MYSQL_PASSWORD
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true

    servlet:
      multipart:
        enabled: true
        max-file-size: 5MB
        max-request-size: 25MB

  eureka:
    client:
      enabled: false

  jwt:
    secret: YOUR_JWT_SECRET
    expiration: 3600000

  sms:
    test:
      mode: true

  file:
    upload:
      dir: uploads/delivery-partners

  logging:
    level:
      com.revature.deliveryservice: DEBUG